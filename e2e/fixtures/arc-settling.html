<!doctype html>
<meta charset="utf-8">
<title>Second Cursor settling fixture</title>
<style>
  body { font: 18px system-ui; padding: 36px; background: white; color: #222; }
  button { font: inherit; margin: 8px; padding: 10px 16px; }
  #result { margin-top: 24px; min-height: 32px; }
  #badge { display: inline-block; width: 10px; height: 10px; background: #777; }
  #caret { display: inline-block; width: 2px; height: 20px; background: #222; }
  .blink { animation: blink 0.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  dialog { border: 1px solid #777; padding: 32px; }
</style>
<h1>Settling fixture</h1>
<p id="description"></p>
<button id="background">Start background polling</button>
<button id="run">Run action</button>
<span id="badge" role="img" aria-label="Pending badge"></span>
<span id="caret" aria-hidden="true"></span>
<div id="result" role="status">Waiting for action</div>
<dialog id="dialog"><p id="dialog-result"></p></dialog>
<script>
const fixtureCase = new URLSearchParams(location.search).get('case') || 'immediate';
const marker = 'Effect ready: ' + fixtureCase;
document.querySelector('#description').textContent = fixtureCase;
if (fixtureCase.includes('blink')) document.querySelector('#caret').className = 'blink';
window.__arcActionCount = 0;
function finish(dialog = false) {
  const result = document.querySelector(dialog ? '#dialog-result' : '#result');
  if (fixtureCase !== 'badge_800_blink') result.textContent = marker;
  document.querySelector('#badge').style.background = '#ff00ff';
  document.querySelector('#badge').setAttribute('aria-label', marker);
  if (dialog) document.querySelector('#dialog').showModal();
}
document.querySelector('#background').onclick = () => {
  fetch('/longpoll?case=' + encodeURIComponent(fixtureCase)).catch(() => {});
};
document.querySelector('#run').onclick = async () => {
  // Instrumentation deliberately does not mutate DOM: that would give a
  // mutation-based settler an artificial early reaction to the action.
  window.__arcActionCount += 1;
  if (fixtureCase.startsWith('slow_fetch')) {
    if (fixtureCase === 'slow_fetch_loading') document.querySelector('#result').textContent = 'Loading';
    const response = await fetch('/delay?ms=4000');
    if (fixtureCase === 'slow_fetch_consumed') await response.json();
    finish();
  } else if (fixtureCase === 'streamed_response') {
    // Headers and a partial JSON document arrive immediately. Completing this
    // action requires the delayed remaining body, not merely a response event.
    const response = await fetch('/stream?ms=4000');
    const body = await response.json();
    if (body.status === 'ready') finish();
  } else if (fixtureCase === 'late_fetch_800') {
    setTimeout(async () => { await fetch('/delay?ms=800'); finish(); }, 800);
  } else if (fixtureCase.startsWith('never_fetch')) {
    await fetch('/longpoll?case=action-never'); finish();
  } else if (fixtureCase.startsWith('dialog_')) {
    setTimeout(() => finish(true), Number(fixtureCase.split('_')[1]));
  } else if (fixtureCase === 'badge_800_blink') {
    setTimeout(() => finish(), 800);
  } else {
    finish();
  }
};
</script>
